[project]
name = "limo-agent"
version = "0.1.0"
description = "AI agent API for the limo booking platform (FastAPI + Ollama + Laravel MySQL)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "RET", "TID", "ANN"]
ignore = [
    "ANN401",  # Any is legitimate for JSON payloads
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not integration'"
markers = ["integration: needs real Ollama + MySQL (run with: pytest -m integration)"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Starlette 1.x prefers httpx2 for its TestClient; the app (and respx) use httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

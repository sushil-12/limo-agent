# Alembic config for limo-rt's own tables (tbl_rt_*). Laravel owns every other table.
#
#   .venv/bin/alembic -c alembic_rt.ini upgrade head
#
# Connects as RT_MIGRATE_DB_USERNAME / RT_MIGRATE_DB_PASSWORD (deploy-time only user),
# with DB_HOST / DB_PORT / DB_DATABASE from .env. See docs/realtime/DEPLOY.md.

[alembic]
script_location = app/realtime/migrations
version_table = alembic_version_rt
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

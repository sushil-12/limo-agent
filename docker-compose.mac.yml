# macOS override: API in Docker, Ollama native on the Mac (Docker can't use the Apple GPU).
#
#   docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d
# or put COMPOSE_FILE=docker-compose.yml:docker-compose.mac.yml in .env and use plain
# `docker compose` / `make up`.
#
# Run Ollama on the host first (Ollama.app, or `ollama serve`) and pull OLLAMA_MODEL there.

services:
  api:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on: !reset {}

  ollama:
    profiles: [bundled-ollama]  # not started unless --profile bundled-ollama is given

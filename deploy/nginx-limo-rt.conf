# nginx site for rt.1800limo.com -> limo-rt on 127.0.0.1:9100.
# If the host runs Apache instead, see docs/realtime/README.md ("Apache instead of nginx").

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream limo_rt {
    server 127.0.0.1:9100;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name rt.1800limo.com;
    # ssl_certificate / ssl_certificate_key: from certbot or the ALB (then listen 80 here).

    client_max_body_size 64k;

    # WebSocket
    location = /rt/v1/ws {
        proxy_pass http://limo_rt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # > ping interval (20 s) + timeout (20 s)
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Public REST API (Passport or share token)
    location /rt/v1/ {
        proxy_pass http://limo_rt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel -> limo-rt only. Never reachable from the internet.
    location ~ ^/(internal|api)/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;       # adjust to the VPC / Laravel host address
        deny all;
        proxy_pass http://limo_rt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / { return 404; }
}

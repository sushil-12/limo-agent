# Redis for limo-rt, on the limoagent host. Install as /etc/redis/limo-rt.conf and run it
# with the distro's redis-server@ unit or the unit in docs/realtime/README.md.

bind 127.0.0.1 -::1
port 6379
protected-mode yes
# Set a long random password; put the same value in REDIS_URL (redis://:<password>@127.0.0.1:6379/0).
requirepass CHANGE_ME_LONG_RANDOM

# Memory: <=10 rides use a few MB. noeviction makes Redis refuse writes instead of silently
# dropping replay streams or once-only alert markers; every key limo-rt writes has a TTL,
# so memory stays bounded on its own.
maxmemory 256mb
maxmemory-policy noeviction

# Durability: a restart must not lose replay data. At most ~1 s of writes can be lost.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
dir /var/lib/redis/limo-rt

# Pub/sub clients (limo-rt's fan-out) must never be cut off for buffering a burst.
client-output-buffer-limit pubsub 32mb 8mb 60
tcp-keepalive 60
timeout 0
loglevel notice
